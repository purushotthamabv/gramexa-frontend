<main>
  <section class="relative h-[58vh] min-h-[380px] max-h-[620px] overflow-hidden bg-gray-950 text-white">
    <div *ngFor="let restaurant of restaurants; let i = index" class="absolute inset-0 transition-opacity duration-700" [class.opacity-100]="activeSlide === i" [class.opacity-0]="activeSlide !== i">
      <img [src]="slideImage(i)" [alt]="restaurant.restaurantName" class="h-full w-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/45 to-black/20"></div>
    </div>
    <div *ngIf="restaurants.length" class="relative z-10 flex h-full items-end px-8 pb-16 sm:px-16 lg:px-24">
      <div class="max-w-2xl"><p class="mb-3 text-xs font-semibold uppercase tracking-[0.25em] text-emerald-300">{{ bannerEyebrow(restaurants[activeSlide]) }}</p><h1 class="text-5xl font-black leading-tight sm:text-7xl">{{ restaurants[activeSlide].restaurantName }}</h1><p class="mt-5 max-w-lg text-base text-gray-200">{{ bannerDescription(restaurants[activeSlide]) }}</p><button type="button" (click)="openRestaurant(restaurants[activeSlide].restaurantId)" class="min-w-[100px] mt-8 inline-flex items-center justify-center rounded-[32px] bg-emerald-500 px-4 py-4 font-semibold tracking-[1px] shadow-xl transition hover:scale-105 hover:bg-emerald-400">Explore<img src="assets/arrow-right.svg" alt="" aria-hidden="true"></button></div>
    </div>
    <div *ngIf="restaurants.length > 1" class="absolute bottom-8 right-8 z-20 flex items-center gap-3 sm:right-16"><button type="button" (click)="previousSlide()" aria-label="Previous restaurant" class="rounded-full border border-white/40 px-4 py-2 text-xl hover:bg-white/20">‹</button><span class="text-sm">{{ activeSlide + 1 }} / {{ restaurants.length }}</span><button type="button" (click)="nextSlide()" aria-label="Next restaurant" class="rounded-full border border-white/40 px-4 py-2 text-xl hover:bg-white/20">›</button></div>
  </section>
  <section class="bg-[#f5fbf6] px-8 py-16 sm:px-16 lg:px-24"><div class="mx-auto max-w-7xl"><p class="font-semibold uppercase tracking-[0.25em] text-emerald-600">Eat local, eat well</p><h2 class="mt-2 text-4xl font-black text-gray-800">Restaurants for every craving</h2><input [(ngModel)]="searchTerm" (input)="searchRestaurants()" type="search" placeholder="Search restaurants..." class="mt-6 w-full max-w-xl rounded-full bg-white px-5 py-3 text-gray-800 outline-none shadow-sm"><div class="mt-10 grid gap-8 sm:grid-cols-2 lg:grid-cols-3"><button *ngFor="let restaurant of filteredRestaurants" type="button" (click)="openRestaurant(restaurant.restaurantId)" class="restaurant-card group text-left"><div class="relative overflow-hidden"><img [src]="restaurant.imageUrl || fallbackImages[0]" [alt]="restaurant.restaurantName" class="h-56 w-full object-cover transition duration-500 group-hover:scale-110"><span class="absolute right-4 top-4 rounded-full bg-white/90 px-3 py-1 text-xs font-bold text-emerald-700">{{ restaurant.currency }}</span></div><div class="p-6"><h3 class="text-2xl font-bold text-gray-800">{{ restaurant.restaurantName }}</h3><p class="mt-2 text-gray-500">View menu <span class="text-emerald-600 transition group-hover:ml-2">→</span></p></div></button></div></div></section>
</main>
