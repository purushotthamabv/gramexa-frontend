<section class="mx-auto max-w-3xl px-5 py-10">
    <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h1 class="text-3xl font-bold text-gray-800">Change Password</h1>
        <p class="mt-2 text-gray-500">Use a strong password with at least 6 characters.</p>

        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
            <div>
                <label class="mb-2 block font-semibold text-gray-700">Current Password</label>
                <input type="password" formControlName="currentPassword" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="passwordForm.get('currentPassword')?.touched && passwordForm.get('currentPassword')?.invalid" class="mt-1 text-sm text-red-500">
                    Current password is required
                </p>
            </div>

            <div>
                <label class="mb-2 block font-semibold text-gray-700">New Password</label>
                <input type="password" formControlName="newPassword" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid" class="mt-1 text-sm text-red-500">
                    Password must be at least 6 characters
                </p>
            </div>

            <div>
                <label class="mb-2 block font-semibold text-gray-700">Confirm New Password</label>
                <input type="password" formControlName="confirmPassword" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.get('confirmPassword')?.invalid" class="mt-1 text-sm text-red-500">
                    Confirm password is required
                </p>
            </div>

            <p *ngIf="errorMessage" class="rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
                {{ errorMessage }}
            </p>

            <p *ngIf="successMessage" class="rounded-xl bg-green-50 px-4 py-3 text-sm font-medium text-green-700">
                {{ successMessage }}
            </p>

            <button type="submit" [disabled]="isSaving" class="w-full rounded-2xl bg-green-600 py-4 text-lg font-semibold text-white shadow-xl transition-all duration-300 hover:scale-[1.02] hover:bg-green-700 active:scale-95 disabled:cursor-not-allowed disabled:bg-green-400">
                {{ isSaving ? 'Changing...' : 'Change Password' }}
            </button>
        </form>
    </div>
</section>
