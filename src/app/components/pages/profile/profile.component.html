<section class="mx-auto max-w-3xl px-5 py-10">
    <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h1 class="text-3xl font-bold text-gray-800">Update Profile</h1>
        <p class="mt-2 text-gray-500">Keep your account details up to date.</p>

        <p *ngIf="isLoading" class="mt-6 text-gray-500">Loading profile...</p>

        <form *ngIf="!isLoading" [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
            <div>
                <label class="mb-2 block font-semibold text-gray-700">Full Name</label>
                <input type="text" formControlName="name" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.invalid" class="mt-1 text-sm text-red-500">
                    Full name is required
                </p>
            </div>

            <div>
                <label class="mb-2 block font-semibold text-gray-700">Email Address</label>
                <input type="email" formControlName="email" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.invalid" class="mt-1 text-sm text-red-500">
                    Enter a valid email address
                </p>
            </div>

            <div>
                <label class="mb-2 block font-semibold text-gray-700">Mobile Number</label>
                <input type="text" formControlName="mobileNumber" class="w-full rounded-xl border border-gray-300 p-3 px-4 outline-none transition-all duration-300 focus:border-green-600 focus:ring-4 focus:ring-green-100">
                <p *ngIf="profileForm.get('mobileNumber')?.touched && profileForm.get('mobileNumber')?.invalid" class="mt-1 text-sm text-red-500">
                    Enter valid 10 digit mobile number starting with 6-9
                </p>
            </div>

            <div>
                <label class="mb-2 block font-semibold text-gray-700">Role</label>
                <input type="text" formControlName="role" class="w-full rounded-xl border border-gray-200 bg-gray-50 p-3 px-4 text-gray-500">
            </div>

            <div *ngIf="profileForm.get('role')?.value === 'USER'" class="rounded-xl bg-emerald-50 p-4">
                <p class="text-sm text-emerald-800">Want to manage restaurants and menus?</p>
                <button type="button" (click)="requestAdminAccess()" [disabled]="isRequestingAdmin" class="mt-3 rounded-xl bg-emerald-700 px-4 py-2 text-sm font-semibold text-white disabled:opacity-60">
                    {{ isRequestingAdmin ? 'Submitting...' : 'Request Admin Access' }}
                </button>
            </div>

            <p *ngIf="errorMessage" class="rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
                {{ errorMessage }}
            </p>

            <p *ngIf="successMessage" class="rounded-xl bg-green-50 px-4 py-3 text-sm font-medium text-green-700">
                {{ successMessage }}
            </p>

            <button type="submit" [disabled]="isSaving" class="w-full rounded-2xl bg-green-600 py-4 text-lg font-semibold text-white shadow-xl transition-all duration-300 hover:scale-[1.02] hover:bg-green-700 active:scale-95 disabled:cursor-not-allowed disabled:bg-green-400">
                {{ isSaving ? 'Saving...' : 'Save Profile' }}
            </button>
        </form>
    </div>
</section>
